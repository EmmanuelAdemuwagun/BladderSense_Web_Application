<!DOCTYPE html>

    <!-- Mobile-first: primary target is iPhone 14 Pro Max (430×932).
         viewport-fit=cover enables safe-area insets around the Dynamic Island
         and home indicator. We do NOT lock maximum-scale, so seniors can
         pinch-zoom for readability (an accessibility requirement). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a5276" />
    <!-- Stop iOS from auto-linking emails / phone numbers into blue underlined links -->
    <meta name="format-detection" content="telephone=no, email=no, address=no" />

    <!-- ===================== SEO: primary tags ===================== -->
    <title>BladderSense — Bladder Health Guide for Men | Better Days, Better Nights</title>

    />

      name="keywords"
      content="bladder health, bladder control, men's health, night-time urination, nocturia, overactive bladder, pelvic floor exercises, urinary urgency, prostate, self-management, older men, sleep"
    />
    <meta name="author" content="BladderSense" />
