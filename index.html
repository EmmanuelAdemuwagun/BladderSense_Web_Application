<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile-first: primary target is iPhone 14 Pro Max (430×932).
         viewport-fit=cover enables safe-area insets around the Dynamic Island
         and home indicator. We do NOT lock maximum-scale, so seniors can
         pinch-zoom for readability (an accessibility requirement). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a5276" />
    <!-- Stop iOS from auto-linking emails / phone numbers into blue underlined links -->
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <title>Bladder Health Guide for Men</title>
    <meta name="description" content="A practical guide to improving bladder control through small daily changes." />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
  </head>
  <body>
    <div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
